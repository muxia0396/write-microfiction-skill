name: 功能建议
description: 建议新的工作流、失败模式检查、测试题或脚本能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述当前工作流在哪类任务中不足。
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: 示例任务
      description: 给出一个不含受保护原文或个人信息的可复现提示词。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明希望调整的规则、参考文件、脚本或评测方式。

  - type: textarea
    id: risks
    attributes:
      label: 风险与反例
      description: 这项规则可能在哪些题材或任务中产生副作用？

